name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    timeout-minutes: 30
    steps:
    - name: Restore Nightly Toolchain Cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.rustup/toolchains/nightly-*/
          ~/.rustup/update-hashes/nightly-*/
        key: ${{ runner.os }}-rust-nightly-
        restore-keys: ${{ runner.os }}-rust-nightly-

    - name: Install Nightly Toolchain and Miri
      id: rust-nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri, rust-src

    - name: Save Nightly Toolchain Cache
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.rustup/toolchains/nightly-*/
          ~/.rustup/update-hashes/nightly-*/
        key: ${{ runner.os }}-rust-nightly-${{ steps.rust-nightly.outputs.cachekey }}

    - name: Checkout Koopa
      uses: actions/checkout@v6

    - name: Build
      run: cargo +stable check && cargo +stable check --all-features

    - name: Clippy
      run: cargo +stable clippy --all-targets -- -D warnings && cargo +stable clippy --all-targets --all-features -- -D warnings

    - name: Format
      run: cargo +stable fmt --all --check

    - name: Test
      run: |
        cargo +stable test --workspace --all-targets
        cargo +stable test --workspace --all-targets --all-features
        cargo +stable test --workspace --doc

    - name: Miri
      run: |
        cargo +nightly miri test --workspace
        cargo +nightly miri test -p koopa --example interpreter --example opt

  windows-libkoopa:
    name: Test libkoopa on Windows
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    timeout-minutes: 30
    steps:
    - name: Checkout Koopa
      uses: actions/checkout@v6

    - name: Test libkoopa
      run: cargo +stable test --locked -p libkoopa
